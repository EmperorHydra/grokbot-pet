<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<style>
  html, body { margin: 0; width: 260px; height: 170px; overflow: hidden; background: transparent; user-select: none; -webkit-user-select: none; }
  #bubble {
    position: absolute; left: 50%; bottom: 84px; transform: translateX(-50%) scale(.85); transform-origin: 50% 100%;
    width: max-content; max-width: 220px; max-height: 76px; overflow: hidden; padding: 8px 12px; box-sizing: border-box;
    background: #fff; color: #222; border-radius: 14px; text-align: center; cursor: pointer;
    font: 500 13px/1.3 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif;
    box-shadow: 0 2px 8px rgba(0,0,0,.3); opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s;
  }
  #bubble.show { opacity: 1; transform: translateX(-50%) scale(1); pointer-events: auto; }
  #bubble b { display: block; font-weight: 700; }
  #bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-bottom: 0; border-top-color: #fff; }
  #pet { position: absolute; left: 94px; top: 94px; width: 72px; height: 72px; cursor: grab; }
  #pet:active { cursor: grabbing; }
  #bob { width: 100%; height: 100%; animation: bob 2.6s ease-in-out infinite; }
  #shadow { position: absolute; left: 50%; bottom: -4px; width: 44px; height: 6px; margin-left: -22px; border-radius: 50%; background: rgba(0,0,0,.2); animation: sh 2.6s ease-in-out infinite; }
  #wig { width: 100%; height: 100%; transform-origin: 50% 90%; }
  #wig.wiggle { animation: wiggle .6s ease-in-out; }
  #wig.alert { animation: alert 1.2s ease-in-out; }
  @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
  @keyframes sh { 0%,100% { transform: scale(1); opacity: 1; } 50% { transform: scale(.8); opacity: .6; } }
  @keyframes wiggle { 0%,100% { transform: rotate(0); } 20% { transform: rotate(-12deg) scale(1.08); } 45% { transform: rotate(10deg) scale(1.08); } 70% { transform: rotate(-6deg); } }
  @keyframes alert { 0%,100% { transform: translateY(0) scale(1); } 15% { transform: translateY(-22px) scale(1.1); } 30% { transform: translateY(0) scale(.95); } 45% { transform: translateY(-14px) rotate(-8deg); } 60% { transform: translateY(0) rotate(8deg); } 80% { transform: rotate(-4deg); } }
  .eyelid { opacity: 0; }
  .blink .eyelid { opacity: 1; }
  .look { transition: transform .25s ease-out; }
  #badge {
    position: absolute; right: -4px; top: -2px; min-width: 20px; height: 20px; padding: 0 5px; box-sizing: border-box; border-radius: 10px;
    background: #ff3b30; color: #fff; border: 2px solid #fff; font: 700 11px/16px -apple-system, "Helvetica Neue", sans-serif; text-align: center;
    display: none; pointer-events: none;
  }
  #badge.show { display: block; }
</style>
</head>
<body>
<div id="bubble"></div>
<div id="pet">
  <div id="shadow"></div>
  <div id="bob"><div id="wig">
    <svg viewBox="0 0 72 72" width="72" height="72" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <radialGradient id="g" cx="38%" cy="30%" r="75%"><stop offset="0" stop-color="#4a4d55"/><stop offset=".45" stop-color="#17181b"/><stop offset="1" stop-color="#000"/></radialGradient>
      </defs>
      <circle cx="36" cy="36" r="33" fill="url(#g)"/>
      <ellipse cx="26" cy="15" rx="13" ry="6" fill="#fff" opacity=".22" transform="rotate(-22 26 15)"/>
      <g id="eyes" class="look">
        <ellipse cx="26" cy="37" rx="7.2" ry="8" fill="#fff"/>
        <ellipse cx="46" cy="37" rx="7.2" ry="8" fill="#fff"/>
        <circle id="p1" cx="27" cy="38.5" r="2.4" fill="#0b0b0d"/>
        <circle id="p2" cx="47" cy="38.5" r="2.4" fill="#0b0b0d"/>
        <ellipse class="eyelid" cx="26" cy="37" rx="7.9" ry="8.7" fill="#0a0a0b"/>
        <ellipse class="eyelid" cx="46" cy="37" rx="7.9" ry="8.7" fill="#0a0a0b"/>
      </g>
    </svg>
  </div></div>
  <div id="badge"></div>
</div>
<script src="renderer.js"></script>
</body>
</html>
