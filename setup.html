<!doctype html>
<html><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'self'">
<title>Grok Bot Pet Setup</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; background: #0b0b0d; color: #fff; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Helvetica Neue", sans-serif; -webkit-user-select: none; user-select: none; }
  body { padding: 22px 26px 20px; }
  h1 { font-size: 20px; margin: 0 0 2px; } .sub { color: #9a9aa3; margin: 0 0 16px; }
  label { display: block; font-weight: 600; margin: 14px 0 6px; } .hint { color: #9a9aa3; font-weight: 400; }
  .row { display: flex; gap: 8px; }
  input { flex: 1; min-width: 0; background: #17171b; color: #fff; border: 1px solid #34343b; border-radius: 8px; padding: 8px 10px; font: 12.5px ui-monospace, Menlo, monospace; -webkit-user-select: text; user-select: text; }
  input:focus { outline: none; border-color: #fff; }
  button { background: #fff; color: #000; border: 0; border-radius: 8px; padding: 8px 14px; font: 600 13px -apple-system, sans-serif; cursor: pointer; white-space: nowrap; }
  button.ghost { background: #232328; color: #fff; } button:active { opacity: .7; }
  ol { margin: 6px 0 0; padding-left: 20px; color: #d6d6dc; } li { margin: 4px 0; }
  #err { color: #ff6b6b; min-height: 18px; margin-top: 6px; font-size: 12.5px; } #msg { color: #7ee787; font-size: 12.5px; }
  .foot { display: flex; justify-content: space-between; align-items: center; margin-top: 16px; }
</style></head>
<body>
  <h1>Grok Bot Pet</h1>
  <p class="sub">A floating ball that tells you when something is done.</p>

  <label>Your private notification URL <span class="hint">(acts like a password, don't share it)</span></label>
  <div class="row"><input id="url" readonly><button id="copyUrl">Copy</button></div>

  <label>Grok Bot chat link <span class="hint">(optional) clicking the ball opens it</span></label>
  <input id="click" placeholder="grokbot://… or https://…" style="width:100%">
  <div id="err"></div>

  <label>Set up in 3 steps</label>
  <ol>
    <li>Copy the URL.</li>
    <li>Tell your Grok Bot: <i>“When you finish tasks, post a short message to <b>your URL</b> with curl -d”</i>
      <button class="ghost" id="copyMsg" style="padding:3px 9px;margin-left:4px">Copy this message</button></li>
    <li>Click Done.</li>
  </ol>

  <div class="foot">
    <button class="ghost" id="test">Send test notification</button>
    <span id="msg"></span>
    <button id="done">Done</button>
  </div>
<script src="setup.js"></script>
</body></html>
